<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/react.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroYomi - Premium Manga & Ebook Reader</title>
    <meta name="description" content="Immersive manga, webtoons, light novels and ebook reading platform with beautiful vertical and horizontal views, coin wallet checks, and indie creator studio." />
    <script>
      (function() {
        try {
          var key = 'kuroyomi_theme_preference';
          var saved = localStorage.getItem(key);
          var resolved = 'dark';
          if (saved === 'light' || saved === 'dark') {
            resolved = saved;
          } else if (saved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
